<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>啟動您的千萬退休藍圖｜定期定額試算工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #F4F1EA;
            color: #4A3B32;
        }
    </style>
</head>
<body class="min-h-screen py-8 px-4 flex flex-col items-center justify-center">

    <div class="max-w-md w-full bg-[#EBE5D8] border border-[#D5CCC0] rounded-2xl shadow-xl p-6 sm:p-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-center text-[#5C4B40] mb-2 tracking-wide">啟動您的千萬退休藍圖</h1>
        <h2 class="text-lg font-medium text-center text-[#8C7A6B] mb-6">定期定額投資目標試算</h2>
        <div class="w-16 h-0.5 bg-[#C2B5A3] mx-auto mb-8"></div>

        <div class="space-y-4">
            <div class="bg-[#DFD8CC] p-4 rounded-xl border border-[#D0C6B8]">
                <label class="block text-xs font-semibold text-[#7A6A5C] mb-1">目標退休金</label>
                <div class="flex items-center justify-between">
                    <input type="number" id="targetAmount" value="30000000" class="w-full bg-transparent text-xl sm:text-2xl font-bold text-[#4A3B32] focus:outline-none" placeholder="30000000">
                    <span class="text-sm font-medium text-[#7A6A5C] whitespace-nowrap ml-2">元</span>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="bg-[#DFD8CC] p-4 rounded-xl border border-[#D0C6B8]">
                    <label class="block text-xs font-semibold text-[#7A6A5C] mb-1">現在年齡</label>
                    <div class="flex items-center justify-between">
                        <input type="number" id="currentAge" value="50" class="w-full bg-transparent text-2xl font-bold text-[#4A3B32] focus:outline-none">
                        <span class="text-sm font-medium text-[#7A6A5C] ml-2">歲</span>
                    </div>
                </div>
                <div class="bg-[#DFD8CC] p-4 rounded-xl border border-[#D0C6B8]">
                    <label class="block text-xs font-semibold text-[#7A6A5C] mb-1">退休年齡</label>
                    <div class="flex items-center justify-between">
                        <input type="number" id="retirementAge" value="65" class="w-full bg-transparent text-2xl font-bold text-[#4A3B32] focus:outline-none">
                        <span class="text-sm font-medium text-[#7A6A5C] ml-2">歲</span>
                    </div>
                </div>
            </div>

            <div class="bg-[#DFD8CC] p-4 rounded-xl border border-[#D0C6B8]">
                <label class="block text-xs font-semibold text-[#7A6A5C] mb-1">預期年化投資報酬率</label>
                <div class="flex items-center justify-between">
                    <input type="number" id="returnRate" value="10" step="0.5" class="w-full bg-transparent text-2xl font-bold text-[#4A3B32] focus:outline-none">
                    <span class="text-sm font-medium text-[#7A6A5C] whitespace-nowrap ml-2">% / 年</span>
                </div>
            </div>
        </div>

        <div class="mt-6 bg-[#5C4B40] text-[#F4F1EA] p-6 rounded-2xl shadow-inner text-center">
            <p class="text-xs font-medium tracking-wider text-[#D5CCC0] mb-1">建議每月定期定額投入金額</p>
            <div class="flex items-baseline justify-center space-x-2 my-2">
                <span id="monthlySave" class="text-4xl sm:text-5xl font-extrabold tracking-tight">72,382</span>
                <span class="text-xl font-bold text-[#D5CCC0]">元 / 月</span>
            </div>
            <p class="text-xs text-[#D5CCC0] mt-1">（約合每年投入 <span id="yearlySave" class="font-bold text-white">86.9</span> 萬元）</p>

            <div class="grid grid-cols-2 gap-2 mt-5 pt-4 border-t border-[#7A6A5C] text-center text-sm">
                <div>
                    <p class="text-[11px] text-[#C2B5A3]">投資總年期</p>
                    <p id="totalYears" class="font-bold text-white mt-0.5">15 年</p>
                </div>
                <div class="border-l border-[#7A6A5C]">
                    <p class="text-[11px] text-[#C2B5A3]">本利和達成目標</p>
                    <p id="targetDisplay" class="font-bold text-white mt-0.5">3,000 萬</p>
                </div>
            </div>
        </div>

        <div class="text-center mt-6 text-xs text-[#8C7A6B] font-medium">
            理財規劃專用試算工具
        </div>
    </div>

    <script>
        function calculateDCA() {
            const FV = parseFloat(document.getElementById('targetAmount').value) || 0;
            const currentAge = parseFloat(document.getElementById('currentAge').value) || 0;
            const retirementAge = parseFloat(document.getElementById('retirementAge').value) || 0;
            const annualRate = (parseFloat(document.getElementById('returnRate').value) || 0) / 100;

            const years = Math.max(1, retirementAge - currentAge);
            const months = years * 12;
            const monthlyRate = annualRate / 12;

            let monthlySave = 0;
            if (monthlyRate > 0) {
                monthlySave = FV * monthlyRate / (Math.pow(1 + monthlyRate, months) - 1);
            } else {
                monthlySave = FV / months;
            }

            const monthlyRounded = Math.round(monthlySave);
            const yearlyRounded = (monthlyRounded * 12 / 10000).toFixed(1);

            let targetText = "";
            if (FV >= 100000000) {
                targetText = (FV / 100000000).toFixed(2).replace(/\.00$/, '') + " 億";
            } else if (FV >= 10000) {
                targetText = Math.round(FV / 10000).toLocaleString() + " 萬";
            } else {
                targetText = FV.toLocaleString() + " 元";
            }

            document.getElementById('monthlySave').innerText = monthlyRounded.toLocaleString();
            document.getElementById('yearlySave').innerText = yearlyRounded;
            document.getElementById('totalYears').innerText = years + ' 年';
            document.getElementById('targetDisplay').innerText = targetText;
        }

        ['targetAmount', 'currentAge', 'retirementAge', 'returnRate'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculateDCA);
        });

        calculateDCA();
    </script>
</body>
</html>
