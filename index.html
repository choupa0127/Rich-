<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>個人資產配置試算</title>
    <style>
        body {
            background-color: #f7f3ec; /* 柔和米色背景 */
            color: #4a403a;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            border: 1px solid #e6dfd5;
        }
        h2 {
            text-align: center;
            color: #5c4033;
            font-size: 22px;
            margin-bottom: 5px;
            margin-top: 0;
        }
        .subtitle {
            text-align: center;
            color: #8c7365;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 14px;
            font-weight: bold;
            color: #8c7365;
            margin: 16px 0 8px 0;
            border-bottom: 1px solid #f0eae1;
            padding-bottom: 4px;
        }
        .input-group {
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .input-group label {
            font-size: 14px;
            color: #5c4033;
        }
        .input-group input {
            background: #faf8f5;
            border: 1px solid #d9d0c5;
            color: #4a403a;
            font-size: 16px;
            padding: 6px 10px;
            border-radius: 8px;
            width: 130px;
            text-align: right;
            outline: none;
        }
        .checkbox-group {
            margin: 15px 0;
            font-size: 14px;
            color: #5c4033;
            background: #faf8f5;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #d9d0c5;
        }
        .checkbox-group label {
            cursor: pointer;
            display: flex;
            align-items: center;
        }
        .checkbox-group input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            accent-color: #c0392b;
        }
        .result-box {
            background-color: #faf6f0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
            border: 1px solid #d9d0c5;
        }
        .result-title {
            font-size: 14px;
            color: #8c7365;
        }
        .result-amount {
            font-size: 34px;
            font-weight: bold;
            color: #c0392b; /* 紅色計算結果字體 */
            margin: 8px 0;
        }
        .result-details {
            display: flex;
            justify-content: space-around;
            margin-top: 12px;
            font-size: 13px;
            color: #6c584c;
            border-top: 1px solid #e6dfd5;
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>個人資產配置試算</h2>
    <div class="subtitle">專屬你的現金流與複利計畫</div>

    <div class="section-title">1. 現金流計算</div>
    <div class="input-group">
        <label>每月總收入</label>
        <input type="number" id="income" value="50000" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>固定支出 (房租/貸款等)</label>
        <input type="number" id="fixedExpense" value="15000" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>變動支出 (伙食/娛樂等)</label>
        <input type="number" id="variableExpense" value="15000" oninput="calculate()">
    </div>

    <!-- 緊急預備金勾選區 -->
    <div class="checkbox-group">
        <label>
            <input type="checkbox" id="hasEmergencyFund" onchange="toggleEmergency(); calculate();">
            已備妥 3-6 個月緊急預備金（勾選即免填）
        </label>
    </div>
    
    <div class="input-group" id="emergencyGroup">
        <label>每月需額外存緊急預備金</label>
        <input type="number" id="emergencyFund" value="5000" oninput="calculate()">
    </div>

    <div class="section-title">2. 投資設定</div>
    <div class="input-group">
        <label>投入年限 (年)</label>
        <input type="number" id="years" value="20" oninput="calculate()">
    </div>
    <div class="input-group">
        <label>預期年報酬率 (%)</label>
        <input type="number" id="returnRate" value="6" step="0.5" oninput="calculate()">
    </div>

    <!-- 結果呈現 -->
    <div class="result-box">
        <div class="result-title">預估未來總資產 (複利滾存)</div>
        <div class="result-amount" id="totalAsset">0 元</div>
        <div class="result-details">
            <div>每月可投入：<span id="monthlyInvest">0 元</span></div>
            <div>累積本金：<span id="totalPrincipal">0 元</span></div>
        </div>
    </div>
</div>

<script>
function toggleEmergency() {
    let isChecked = document.getElementById('hasEmergencyFund').checked;
    let emergencyGroup = document.getElementById('emergencyGroup');
    let emergencyInput = document.getElementById('emergencyFund');
    
    if (isChecked) {
        emergencyGroup.style.display = 'none';
        emergencyInput.value = 0; 
    } else {
        emergencyGroup.style.display = 'flex';
        emergencyInput.value = 5000; 
    }
}

function calculate() {
    let income = parseFloat(document.getElementById('income').value) || 0;
    let fixedExpense = parseFloat(document.getElementById('fixedExpense').value) || 0;
    let variableExpense = parseFloat(document.getElementById('variableExpense').value) || 0;
    let hasEmergency = document.getElementById('hasEmergencyFund').checked;
    let emergencyFund = hasEmergency ? 0 : (parseFloat(document.getElementById('emergencyFund').value) || 0);
    
    let years = parseFloat(document.getElementById('years').value) || 0;
    let annualRate = (parseFloat(document.getElementById('returnRate').value) || 0) / 100;

    // 計算每月可投入資金 = 收入 - 支出 - 預備金
    let monthlyInvest = income - fixedExpense - variableExpense - emergencyFund;
    if (monthlyInvest < 0) monthlyInvest = 0;

    let months = years * 12;
    let monthlyRate = annualRate / 12;
    let totalPrincipal = monthlyInvest * months;
    let futureValue = 0;

    if (monthlyRate === 0) {
        futureValue = totalPrincipal;
    } else {
        futureValue = monthlyInvest * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
    }

    // 更新畫面顯示
    document.getElementById('monthlyInvest').innerText = Math.round(monthlyInvest).toLocaleString() + ' 元';
    document.getElementById('totalAsset').innerText = Math.round(futureValue).toLocaleString() + ' 元';
    document.getElementById('totalPrincipal').innerText = Math.round(totalPrincipal).toLocaleString() + ' 元';
}

calculate();
</script>

</body>
</html>
