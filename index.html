<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>定期定額複利試算</title>
    <style>
        body {
            background-color: #1a1a2e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            width: 100%;
            max-width: 480px;
            padding: 24px;
            background-color: #16213e;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            border: 1px solid #0f3460;
        }
        h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #e94560;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            color: #b2bec3;
            margin-bottom: 8px;
        }
        .input-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .input-row input[type="number"] {
            background: #0f3460;
            border: 1px solid #e94560;
            color: #fff;
            font-size: 18px;
            padding: 6px 10px;
            border-radius: 8px;
            width: 120px;
            text-align: right;
            outline: none;
        }
        .input-row input[type="range"] {
            flex-grow: 1;
            margin-left: 15px;
            accent-color: #e94560;
        }
        .unit {
            margin-left: 8px;
            color: #b2bec3;
        }
        .result-box {
            background-color: #0f3460;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-top: 25px;
            border: 1px solid #e94560;
        }
        .result-title {
            font-size: 14px;
            color: #b2bec3;
        }
        .result-amount {
            font-size: 38px;
            font-weight: bold;
            color: #f1c40f;
            margin: 10px 0;
        }
        .result-details {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            font-size: 13px;
            color: #dfe6e9;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 12px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>定期定額複利試算</h2>

    <div class="input-group">
        <label>每月投入金額</label>
        <div class="input-row">
            <input type="number" id="monthlyInvest" value="10000" step="1000" oninput="syncInput('monthlyInvestRange', this.value); calculate();">
            <input type="range" id="monthlyInvestRange" min="1000" max="50000" step="1000" value="10000" oninput="syncInput('monthlyInvest', this.value); calculate();">
            <span class="unit">元</span>
        </div>
    </div>

    <div class="input-group">
        <label>投入年限</label>
        <div class="input-row">
            <input type="number" id="years" value="30" min="1" max="50" oninput="syncInput('yearsRange', this.value); calculate();">
            <input type="range" id="yearsRange" min="1" max="50" value="30" oninput="syncInput('years', this.value); calculate();">
            <span class="unit">年</span>
        </div>
    </div>

    <div class="input-group">
        <label>預期年投資報酬率</label>
        <div class="input-row">
            <input type="number" id="returnRate" value="6" step="0.5" min="0" max="20" oninput="syncInput('returnRateRange', this.value); calculate();">
            <input type="range" id="returnRateRange" min="0" max="20" step="0.5" value="6" oninput="syncInput('returnRate', this.value); calculate();">
            <span class="unit">%</span>
        </div>
    </div>

    <div class="result-box">
        <div class="result-title">預估未來總資產</div>
        <div class="result-amount" id="totalAsset">0 元</div>
        <div class="result-details">
            <div>累積本金：<span id="totalPrincipal">0 元</span></div>
            <div>複利滾出收益：<span id="totalInterest">0 元</span></div>
        </div>
    </div>
</div>

<script>
function syncInput(targetId, value) {
    document.getElementById(targetId).value = value;
}

function calculate() {
    let pmt = parseFloat(document.getElementById('monthlyInvest').value) || 0;
    let years = parseFloat(document.getElementById('years').value) || 0;
    let annualRate = (parseFloat(document.getElementById('returnRate').value) || 0) / 100;

    let months = years * 12;
    let monthlyRate = annualRate / 12;
    let totalPrincipal = pmt * months;
    let futureValue = 0;

    if (monthlyRate === 0) {
        futureValue = totalPrincipal;
    } else {
        futureValue = pmt * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate);
    }

    let totalInterest = futureValue - totalPrincipal;

    document.getElementById('totalAsset').innerText = Math.round(futureValue).toLocaleString() + ' 元';
    document.getElementById('totalPrincipal').innerText = Math.round(totalPrincipal).toLocaleString() + ' 元';
    document.getElementById('totalInterest').innerText = Math.round(totalInterest).toLocaleString() + ' 元';
}

calculate();
</script>

</body>
</html>
